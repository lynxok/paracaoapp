name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *' # Executed daily at 06:00 UTC (3:00 AM Argentina)
  workflow_dispatch: # Allows manual execution from GitHub interface

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -s -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
